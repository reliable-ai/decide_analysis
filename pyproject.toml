[project]
name = "decide-analysis"
version = "0.1.0"
description = "Multiverse analyses and decision importance metrics (DECIDE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "configspace>=1.2.2",
    "fanova>=2.0.19",
    "ipykernel>=7.2.0",
    "multiversum>=0.7.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.6",
    "syrupy>=5.0.0",
]
