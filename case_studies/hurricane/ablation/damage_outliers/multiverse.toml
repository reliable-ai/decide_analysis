[dimensions]
death_outliers = [
    "no_exclusion",
    "most_extreme_deaths",
    "most_extreme_two_deaths",
]

# Fixed: damage_outliers = "no_exclusion"
damage_outliers = [
    "no_exclusion",
]

femininity_calculation = [
    "masfem",
    "female",
]

damage_transform = [
    "no_transform",
    "log_transform",
]

model = [
    "linear",
    "poisson",
]

main_interaction = [
    "no",
    "yes",
]

other_predictors = [
    "none",
    "pressure",
    "wind",
    "category",
    "all",
    "all_no_interaction",
]

covariates = [
    "1",
    "2",
    "3",
]

[[constraints.other_predictors]]
value = "pressure"
allowed_if = { main_interaction = "yes" }

[[constraints.other_predictors]]
value = "wind"
allowed_if = { main_interaction = "yes" }

[[constraints.other_predictors]]
value = "category"
allowed_if = { main_interaction = "yes" }

[[constraints.other_predictors]]
value = "all"
allowed_if = { main_interaction = "yes" }

[[constraints.other_predictors]]
value = "all_no_interaction"
allowed_if = { main_interaction = "no" }
